# Standalone compose file — pulls the prebuilt image from GitHub Container
# Registry instead of building locally. No repo clone required: this file
# alone is enough to run FranchiseFinder.
#
# Usage:
#   mkdir franchisefinder && cd franchisefinder
#   curl -O https://raw.githubusercontent.com/pyronsy/FranchiseFinder/main/docker-compose.prebuilt.yml
#   docker compose -f docker-compose.prebuilt.yml up -d
#
# Docker will create ./config and ./data automatically on first run. Once
# it's up, open http://<your-host>:8420 and enter your TMDB/MDBList keys
# (and anything else) on the Settings page — nothing to edit here first.
#
# An .env file is optional — see .env.example in the repo if you'd rather
# pre-fill values instead of typing them into the Settings page.

services:
  franchisefinder:
    image: ghcr.io/pyronsy/franchisefinder:latest
    container_name: franchisefinder
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      - ./config:/config
      - ./data:/data
