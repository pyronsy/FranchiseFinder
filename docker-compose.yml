# The only supported way to run FranchiseFinder: pull the published image.
# No git clone or local build needed — this one file is enough.
#
# Usage:
#   mkdir franchisefinder && cd franchisefinder
#   curl -O https://raw.githubusercontent.com/pyronsy/FranchiseFinder/main/docker-compose.yml
#   docker compose pull
#   docker compose up -d
#
# Docker creates ./config and ./data next to this file automatically on
# first run. Once it's up, open http://<your-host>:8420 and enter your
# TMDB/MDBList keys (and anything else) on the Settings page — nothing
# needs to be edited here first.

services:
  franchisefinder:
    image: ghcr.io/pyronsy/franchisefinder:latest
    container_name: franchisefinder
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      - ./config:/config
      - ./data:/data
    # Optional — pre-fills the Settings page with defaults instead of
    # typing them into the browser. Everything below can be left out
    # entirely and configured in-app instead; uncomment and fill in only
    # what you want to set this way.
    # environment:
    #   - TMDB_API_KEY=
    #   - MDBLIST_API_KEY=
    #   - CHECK_INTERVAL_HOURS=24
    #   - NOTIFY_URL=

  # Uncomment to run a local LLM instead of a cloud provider. Pick "Ollama"
  # as the provider on the Settings page and set Base URL to
  # http://ollama:11434 (the default). After starting, pull a model with:
  #   docker exec -it ollama ollama pull llama3.1
  #
  # ollama:
  #   image: ollama/ollama
  #   container_name: ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ./ollama-data:/root/.ollama
  #   # Uncomment for GPU acceleration (requires the NVIDIA container toolkit):
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: all
  #   #           capabilities: [gpu]
